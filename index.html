<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>여러 사업 실적 통합 대시보드</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main class="dashboard">
  <header class="page-title">
    <h1>여러 사업 실적 통합 대시보드</h1>
    <p class="sub">여러 CSV 파일을 합쳐 참여자·수료자·수료율을 한눈에 확인합니다.</p>
  </header>

  <section class="card" aria-labelledby="h-source">
    <h2 id="h-source">자료</h2>
    <div class="btn-row">
      <button type="button" id="btn-errors">오류 사례 불러오기(errors.csv)</button>
      <button type="button" id="btn-reset">기본 샘플로 되돌리기</button>
      <label class="file-label" for="file-input">CSV 파일 선택
        <input type="file" id="file-input" accept=".csv" multiple>
      </label>
    </div>
    <p class="source-line" id="source-line" aria-live="polite"></p>
  </section>

  <section class="card" aria-labelledby="h-filter">
    <h2 id="h-filter">필터</h2>
    <div class="filter-grid">
      <fieldset class="years" id="year-box">
        <legend>연도 (여러 개 선택)</legend>
        <span id="year-list"></span>
      </fieldset>
      <div class="threshold">
        <label for="threshold">주의 기준 (%)</label>
        <input type="number" id="threshold" value="70" min="0" max="100" step="any">
        <span class="hint">수료율이 기준보다 낮으면 주의</span>
      </div>
    </div>
  </section>

  <section aria-labelledby="h-summary">
    <h2 id="h-summary" class="visually-hidden">요약</h2>
    <div class="summary-grid" id="summary"></div>
  </section>

  <section class="charts" aria-label="차트">
    <article class="card chart-card" id="card-pie">
      <h2>분야별 참여자 비중</h2>
      <p class="chart-note" id="note-pie"></p>
      <div class="pie-wrap" id="pie"></div>
    </article>
    <article class="card chart-card" id="card-bar">
      <h2>사업별 참여자·수료자</h2>
      <p class="chart-note" id="note-bar"></p>
      <div class="scroll-x" id="bar"></div>
    </article>
    <article class="card chart-card chart-wide" id="card-line">
      <h2>연도별 수료율</h2>
      <p class="chart-note" id="note-line"></p>
      <div class="scroll-x" id="line"></div>
      <p class="chart-extra" id="line-extra"></p>
    </article>
  </section>

  <section class="card" aria-labelledby="h-table">
    <div class="card-head">
      <h2 id="h-table">상세 표</h2>
      <button type="button" id="btn-csv">CSV 다운로드</button>
    </div>
    <div class="scroll-x">
      <table id="detail-table">
        <thead>
          <tr><th>연도</th><th>사업ID</th><th>사업명</th><th>분야</th><th>지역</th><th class="num">참여자수</th><th class="num">수료자수</th><th class="num">수료율</th><th>판정</th><th>비고</th></tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </section>

  <section class="card" aria-labelledby="h-excl">
    <h2 id="h-excl">제외된 행</h2>
    <div id="excluded"></div>
  </section>
</main>

<script src="js/data.js"></script>
<script src="js/calc.js"></script>
<script src="js/app.js"></script>
</body>
</html>
